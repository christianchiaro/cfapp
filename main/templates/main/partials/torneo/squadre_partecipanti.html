<div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold text-gray-800">Squadre Partecipanti</h2>
    <span class="text-sm text-gray-600">{{ torneo.teams_count }} squadre</span>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    {% for team in torneo.teams.all %}
    <div class="w-full flex flex-row items-center gap-2 border border-gray-200 rounded-lg p-4">
        <div class="flex-grow flex flex-col">
            <div class="font-semibold text-gray-800">{{ team.name }}</div>
            <div class="text-sm text-gray-500">{{ team.player1.name }} - {{ team.player2.name }}</div>
        </div>
        {% if team.group %}
        {% if team.group == 'A' %}
            <div class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800">Girone {{ team.group }}</div>
        {% else %}
            <div class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">Girone {{ team.group }}</div>
        {% endif %}
        {% endif %}
    </div>
    {% endfor %}
</div>
